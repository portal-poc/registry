name: Promote
# The "promote to tst" button: the versions that passed dev1 go to tst unchanged (no rebuild), as a pull request.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Source stand
        default: dev1
      to:
        description: Target stand (its promoteFrom must be the source)
        default: tst
      remote:
        description: Only this remote (empty = all)
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Authenticate to GitHub Packages (@portal-poc)
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - name: Promote (gate against the target stand's host) and open the PR
        run: |
          git config --global user.name "portal-release"
          git config --global user.email "portal-release@users.noreply.github.com"
          pnpm exec portal-cli promote --from "${{ inputs.from }}" --to "${{ inputs.to }}" ${{ inputs.remote && format('--remote {0}', inputs.remote) || '' }} --pr
        env:
          GH_TOKEN: ${{ github.token }}
